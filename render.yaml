services:
  - type: web
    name: alma-backend
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: alma-db
          property: connectionString
databases:
  - name: alma-db
    plan: free